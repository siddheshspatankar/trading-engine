[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trading-engine"
version = "0.1.0"
description = "AI-Native Intelligent Trading Engine — production-ready algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trading Engine Team" }]

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",

    # Data & quant
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    "statsmodels==0.14.2",
    "ta==0.11.0",           # Technical analysis
    "vectorbt==0.26.2",     # Vectorized backtesting

    # AI / LLM
    "openai==1.30.1",
    "anthropic==0.28.0",
    "langchain==0.2.1",
    "langchain-openai==0.1.8",
    "langchain-community==0.2.1",
    "langgraph==0.1.1",

    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",

    # Cache & messaging
    "redis==5.0.4",
    "aiokafka==0.11.0",
    "aioredis==2.0.1",

    # Broker integrations
    "alpaca-py==0.21.1",
    "yfinance==0.2.38",
    "polygon-api-client==1.14.1",

    # Portfolio optimization
    "cvxpy==1.5.1",
    "PyPortfolioOpt==1.5.5",

    # Observability
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.24.0",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-instrumentation-fastapi==0.45b0",

    # Configuration & validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",

    # Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==42.0.7",

    # Utilities
    "tenacity==8.3.0",
    "schedule==1.2.2",
    "click==8.1.7",
    "rich==13.7.1",
    "arrow==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "factory-boy==3.3.0",
    "freezegun==1.5.1",
    "respx==0.21.1",
]

[project.scripts]
trading-engine = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring live services",
    "e2e: full end-to-end tests",
    "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
